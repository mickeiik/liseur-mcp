[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "liseur-mcp"
version = "0.1.0"
description = "Read-only MCP server for a liseur-sync library: catalog, reading stats, highlights and EPUB text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "mcp==1.28.1",
  "pydantic-settings>=2.7,<3",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
liseur-mcp = "liseur_mcp.__main__:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/liseur_mcp"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=liseur_mcp --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
