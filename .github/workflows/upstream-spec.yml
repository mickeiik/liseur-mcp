name: upstream-spec

# Watches two upstreams we follow: liseur-sync's API spec (the public repo
# publishes docs/openapi.yaml on main and has no tags or releases to watch
# instead) and the MCP Inspector version pinned in scripts/smoke.sh, which
# Dependabot cannot see because it lives in a shell variable.
# It never pushes. A spec change fails the run so the drift shows up in the
# Actions tab; a lagging Inspector pin only files an issue, so it cannot mask
# that failure. workflow_dispatch with simulate_drift proves the issue path.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: "Treat the spec as changed, to exercise the issue path"
        type: boolean
        default: false

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the recorded spec and the Inspector pin with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE_DRIFT: ${{ inputs.simulate_drift }}
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail

          # One label, one dedupe helper: an open issue with the same title is
          # refreshed with a comment instead of being duplicated.
          notify() {
            local existing
            existing=$(gh issue list --state open --label upstream-drift --json number,title \
              | jq -r --arg t "$1" '.[] | select(.title == $t) | .number' | head -1)
            if [ -n "$existing" ]; then
              echo "issue #$existing is already open; adding a comment instead"
              gh issue comment "$existing" --body "$2"
            else
              gh issue create --title "$1" --body "$2" --label upstream-drift
            fi
          }

          # --- the Inspector pin (non-fatal) --------------------------------
          pin=$(grep -oE 'INSPECTOR_VERSION:-[0-9]+(\.[0-9]+){2}' scripts/smoke.sh \
            | grep -oE '[0-9]+(\.[0-9]+){2}' | head -1)
          latest=$(curl -fsSL --retry 3 "$NPM_REGISTRY/@modelcontextprotocol/inspector/latest" \
            | jq -r '.version // empty' 2>/dev/null || true)
          if [ -z "$pin" ] || [ -z "$latest" ]; then
            echo "note: could not compare the Inspector pin (pin='$pin' latest='$latest')"
          elif [ "$pin" != "$latest" ]; then
            gh label create upstream-drift --force \
              --description "an upstream we follow moved" --color 1D76DB
            body=$(printf '%s\n' \
              "\`scripts/smoke.sh\` pins \`@modelcontextprotocol/inspector@$pin\`; npm's latest is \`$latest\`." \
              "" \
              "Bump \`INSPECTOR_VERSION\` in \`scripts/smoke.sh\` (and the README line that names it)," \
              "run \`./scripts/smoke.sh\`, then close this issue.")
            notify "MCP Inspector pin is behind (pinned $pin, latest $latest)" "$body"
            echo "::warning::the Inspector pin is behind: $pin -> $latest"
          else
            echo "Inspector pin is current: $pin"
          fi

          # --- the liseur-sync spec (fatal) ---------------------------------
          url="https://raw.githubusercontent.com/chmouel/liseur-sync/main/docs/openapi.yaml"
          recorded=$(grep -v '^#' docs/upstream-openapi.sha | tr -d '[:space:]')
          current=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)
          echo "recorded: $recorded"
          echo "current : $current"
          if [ "$recorded" = "$current" ] && [ "${SIMULATE_DRIFT:-false}" != "true" ]; then
            echo "liseur-sync's spec is unchanged"
            exit 0
          fi

          gh label create upstream-drift --force \
            --description "an upstream we follow moved" --color 1D76DB

          body=$(printf '%s\n' \
            "\`docs/upstream-openapi.sha\` records a spec that no longer matches [liseur-sync's docs/openapi.yaml](https://github.com/chmouel/liseur-sync/blob/main/docs/openapi.yaml)." \
            "" \
            "- recorded: \`$recorded\`" \
            "- current : \`$current\`" \
            "" \
            "What changed upstream: https://github.com/chmouel/liseur-sync/commits/main/docs/openapi.yaml" \
            "" \
            "What to do here:" \
            "1. Read the changed endpoints and schemas against \`src/liseur_mcp/client.py\` and the tool tests." \
            "2. Run \`uv run python scripts/live_check.py\` from wherever it can reach the instance." \
            "3. Update the hash and date in \`docs/upstream-openapi.sha\`, then close this issue.")
          notify "Upstream liseur-sync OpenAPI spec changed" "$body"

          echo "::error::liseur-sync's OpenAPI spec changed; see the upstream-drift issue"
          exit 1
