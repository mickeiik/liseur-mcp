name: release

# Tag-triggered publication. The tag must match pyproject's version and the
# tagged commit must pass the same checks as any push; only then is the
# release created. See "Releasing" in README.md for the ritual.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the notes are built from the commits since the
          # previous tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # First, and before anything is published: a tag whose version disagrees
      # with pyproject would ship a release that misstates itself.
      - name: Tag must match pyproject's version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
          echo "releasing ${GITHUB_REF_NAME} (pyproject version ${version})"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify the tagged commit
        run: |
          uv lock --check
          uv run pytest
          uv run ruff check
          uv run pyright

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null); then
            range="${prev}..${tag}"
            compare="**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          else
            range="${tag}"
            compare=""
          fi
          notes=$(mktemp)
          {
            printf 'Install: `uv tool install git+https://github.com/%s@%s`\n\n' "${GITHUB_REPOSITORY}" "$tag"
            for type in feat fix test ci chore docs; do
              list=$(git log --no-merges --format='%s' "$range" | grep -E "^${type}(\([^)]*\))?: " | sed 's/^/- /' || true)
              if [ -n "$list" ]; then printf '### %s\n%s\n\n' "$type" "$list"; fi
            done
            other=$(git log --no-merges --format='%s' "$range" | grep -vE '^(feat|fix|test|ci|chore|docs)(\([^)]*\))?: ' | sed 's/^/- /' || true)
            if [ -n "$other" ]; then printf '### other\n%s\n\n' "$other"; fi
            if [ -n "$compare" ]; then printf '%s\n' "$compare"; fi
          } > "$notes"
          cat "$notes"
          gh release create "$tag" --title "$tag" --notes-file "$notes"
